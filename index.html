<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wandel Vibe</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f2;
      color: #222;
    }

    header {
      padding: 18px 20px 10px;
      background: white;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin-top: 5px;
      color: #666;
      font-size: 14px;
    }

    .controls {
      background: white;
      padding: 15px 20px 18px;
      border-bottom: 1px solid #ddd;
    }

    .location-button,
    .route-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .location-button {
      background: #222;
      margin-bottom: 15px;
    }

    .route-button {
      background: #3f7d4c;
      font-size: 17px;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .range {
      text-align: center;
      margin: 12px 0;
      font-size: 14px;
      color: #666;
    }

    #map {
      height: 55vh;
      min-height: 380px;
    }

    .status {
      padding: 12px 20px;
      background: white;
      font-size: 14px;
      color: #555;
      border-bottom: 1px solid #ddd;
    }

    .routes {
      background: #f5f5f2;
      padding: 15px;
    }

    .route-card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      cursor: pointer;
    }

    .route-card:active {
      transform: scale(0.99);
    }

    .route-title {
      font-weight: 700;
      font-size: 16px;
    }

    .route-distance {
      margin-top: 4px;
      color: #666;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>🥾 Wandel Vibe</h1>
  <div class="subtitle">Vind een verrassende wandeling</div>
</header>

<div class="controls">

  <button id="locationButton" class="location-button">
    📍 Gebruik mijn locatie
  </button>

  <div class="fields">

    <div>
      <label for="distance">Gewenste afstand (km)</label>
      <input
        id="distance"
        type="number"
        value="12"
        min="1"
        max="50"
        step="0.5"
      >
    </div>

    <div>
      <label for="margin">Marge (km)</label>
      <input
        id="margin"
        type="number"
        value="1"
        min="0.1"
        max="10"
        step="0.1"
      >
    </div>

  </div>

  <div id="range" class="range">
    Geldig bereik: 11–13 km
  </div>

  <button id="routeButton" class="route-button" disabled>
    ✨ Verrassingsroutes
  </button>

</div>

<div id="status" class="status">
  Eerst je locatie ophalen.
</div>

<div id="map"></div>

<div id="routes" class="routes">
  <div class="empty">
    Nog geen routes gevonden.
  </div>
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  // ============================================================
  // INSTELLINGEN
  // ============================================================

  const VALHALLA_URL =
    "https://valhalla1.openstreetmap.de/route";

  let userLocation = null;
  let map = null;
  let userMarker = null;
  let routeLayers = [];


  /*
    Veel meer richtingen.

    We gebruiken 12 richtingen rondom de gebruiker.
  */

  const BEARINGS = [
    0,
    30,
    60,
    90,
    120,
    150,
    180,
    210,
    240,
    270,
    300,
    330
  ];


  // ============================================================
  // KAART
  // ============================================================

  function createMap(lat, lon) {

    if (!map) {

      map = L.map("map").setView(
        [lat, lon],
        14
      );

      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,

          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }
      ).addTo(map);

    } else {

      map.setView(
        [lat, lon],
        14
      );

    }


    if (userMarker) {
      userMarker.remove();
    }


    userMarker =
      L.marker([lat, lon])
        .addTo(map)
        .bindPopup("📍 Jij bent hier");

  }


  // ============================================================
  // LOCATIE
  // ============================================================

  function getLocation() {

    const button =
      document.getElementById("locationButton");

    const status =
      document.getElementById("status");


    button.disabled = true;
    button.textContent =
      "📍 Locatie ophalen...";

    status.textContent =
      "Je locatie wordt opgehaald...";


    if (!navigator.geolocation) {

      status.textContent =
        "Je browser ondersteunt geen locatiebepaling.";

      button.disabled = false;

      button.textContent =
        "📍 Gebruik mijn locatie";

      return;
    }


    navigator.geolocation.getCurrentPosition(

      function(position) {

        userLocation = {

          lat:
            position.coords.latitude,

          lon:
            position.coords.longitude

        };


        createMap(
          userLocation.lat,
          userLocation.lon
        );


        status.textContent =
          "Locatie gevonden. Klaar om te wandelen!";


        button.disabled = false;

        button.textContent =
          "📍 Locatie opnieuw ophalen";


        document
          .getElementById("routeButton")
          .disabled = false;

      },


      function(error) {

        console.error(error);

        status.textContent =
          "Locatie kon niet worden opgehaald.";

        button.disabled = false;

        button.textContent =
          "📍 Opnieuw proberen";

      },


      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }

    );
  }


  // ============================================================
  // BEREIK
  // ============================================================

  function updateRange() {

    const distance =
      parseFloat(
        document.getElementById("distance").value
      );

    const margin =
      parseFloat(
        document.getElementById("margin").value
      );


    if (
      isNaN(distance) ||
      isNaN(margin)
    ) {
      return;
    }


    const minimum =
      Math.max(
        0,
        distance - margin
      );

    const maximum =
      distance + margin;


    document.getElementById("range").textContent =
